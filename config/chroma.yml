collection_name: agent
persist_directory: chroma_db
k: 2
data_path: data
md5_hex_store: md5.text
allow_knowledge_file_type: ["pdf", "txt"]

chunk_size: 200
chunk_overlap: 20
separators: ["\n\n", "\n", "。", "！", "？", " ", ""]
# 相似度阈值（L2距离，越小越相关，超过此值的chunk丢弃）
similarity_threshold: 1.0
# 单个chunk最大字符数
max_chunk_chars: 150
# 上下文总最大字符数
max_context_chars: 500